openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification for the Games Tracker
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: games
    description: Game library operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /games/cover-search:
    get:
      operationId: searchGameCover
      tags: [games]
      summary: Search for a cover image URL by game title
      parameters:
        - in: query
          name: title
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Cover suggestion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoverSearchResult"

  /games/{id}/achievements:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
    get:
      operationId: getGameAchievements
      tags: [games]
      summary: Fetch the achievement list for a game (sourced from Steam)
      responses:
        "200":
          description: Achievements
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AchievementList"
    post:
      operationId: toggleGameAchievement
      tags: [games]
      summary: Mark an achievement as earned or not
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ToggleAchievementInput"
      responses:
        "200":
          description: Updated achievement list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AchievementList"

  /games:
    get:
      operationId: listGames
      tags: [games]
      summary: List all games
      parameters:
        - in: query
          name: status
          required: false
          schema:
            $ref: "#/components/schemas/GameStatus"
        - in: query
          name: search
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Games
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Game"
    post:
      operationId: createGame
      tags: [games]
      summary: Add a new game to the library
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGameInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"

  /games/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
    get:
      operationId: getGame
      tags: [games]
      summary: Get a single game
      responses:
        "200":
          description: Game
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"
    patch:
      operationId: updateGame
      tags: [games]
      summary: Update a game
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateGameInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"
    delete:
      operationId: deleteGame
      tags: [games]
      summary: Delete a game
      responses:
        "204":
          description: Deleted

  /games/stats:
    get:
      operationId: getGameStats
      tags: [games]
      summary: Aggregate stats about the library
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameStats"

  /games/recent:
    get:
      operationId: getRecentActivity
      tags: [games]
      summary: Recently added or updated games
      responses:
        "200":
          description: Recent
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Game"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    GameStatus:
      type: string
      enum: [played, playing, halted]
      description: |
        played = finished/done. playing = currently playing. halted = paused/dropped.

    Game:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        platform:
          type: string
          nullable: true
        genre:
          type: string
          nullable: true
        status:
          $ref: "#/components/schemas/GameStatus"
        rating:
          type: integer
          minimum: 1
          maximum: 10
          nullable: true
        coverUrl:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        hoursPlayed:
          type: number
          nullable: true
        startedAt:
          type: string
          format: date
          nullable: true
        finishedAt:
          type: string
          format: date
          nullable: true
        steamAppId:
          type: integer
          nullable: true
        earnedAchievements:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, title, status, createdAt, updatedAt]

    CreateGameInput:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        platform:
          type: string
          nullable: true
        genre:
          type: string
          nullable: true
        status:
          $ref: "#/components/schemas/GameStatus"
        rating:
          type: integer
          minimum: 1
          maximum: 10
          nullable: true
        coverUrl:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        hoursPlayed:
          type: number
          nullable: true
        startedAt:
          type: string
          format: date
          nullable: true
        finishedAt:
          type: string
          format: date
          nullable: true
      required: [title, status]

    UpdateGameInput:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        platform:
          type: string
          nullable: true
        genre:
          type: string
          nullable: true
        status:
          $ref: "#/components/schemas/GameStatus"
        rating:
          type: integer
          minimum: 1
          maximum: 10
          nullable: true
        coverUrl:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        hoursPlayed:
          type: number
          nullable: true
        startedAt:
          type: string
          format: date
          nullable: true
        finishedAt:
          type: string
          format: date
          nullable: true

    CoverSearchResult:
      type: object
      properties:
        coverUrl:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        steamAppId:
          type: integer
          nullable: true
      required: [coverUrl]

    Achievement:
      type: object
      properties:
        name:
          type: string
        displayName:
          type: string
        description:
          type: string
          nullable: true
        iconUrl:
          type: string
          nullable: true
        earned:
          type: boolean
      required: [name, displayName, earned]

    AchievementList:
      type: object
      properties:
        steamAppId:
          type: integer
          nullable: true
        total:
          type: integer
        earnedCount:
          type: integer
        achievements:
          type: array
          items:
            $ref: "#/components/schemas/Achievement"
        source:
          type: string
          enum: [steam, none]
      required: [total, earnedCount, achievements, source]

    ToggleAchievementInput:
      type: object
      properties:
        name:
          type: string
        earned:
          type: boolean
      required: [name, earned]

    GameStats:
      type: object
      properties:
        total:
          type: integer
        played:
          type: integer
        playing:
          type: integer
        halted:
          type: integer
        totalHours:
          type: number
        averageRating:
          type: number
          nullable: true
        topGenres:
          type: array
          items:
            type: object
            properties:
              genre:
                type: string
              count:
                type: integer
            required: [genre, count]
        topPlatforms:
          type: array
          items:
            type: object
            properties:
              platform:
                type: string
              count:
                type: integer
            required: [platform, count]
      required: [total, played, playing, backlog, totalHours, topGenres, topPlatforms]
